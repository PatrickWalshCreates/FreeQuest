[package]
name = "freequest-editor"
version = "0.1.0"
description = "FreeQuest Editor"
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "freequest_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-opener = "2"

[profile.release]
# A smaller app to download; the editor's work happens in the web view anyway.
lto = true
opt-level = "s"
codegen-units = 1
strip = true
