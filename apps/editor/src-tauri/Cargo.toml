[package]
name = "freequest-editor"
version = "0.0.0"
description = "FreeQuest Editor"
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "freequest_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-persisted-scope = "2"
