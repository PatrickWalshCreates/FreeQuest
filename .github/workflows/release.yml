name: Release

# Builds the editor downloads. On a version tag (v0.1.0…) they go on a draft
# GitHub Release to check and publish by hand; started by hand ("Run
# workflow"), they're kept as the run's artifacts, to try a build.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    name: macOS (${{ matrix.label }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            label: Apple Silicon
          - target: x86_64-apple-darwin
            label: Intel
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: pnpm build
      # The player inside the editor is universal, so games exported from either download run on any Mac.
      - run: pnpm build:mac-player
      - run: pnpm --filter @freequest/editor build:app
        env:
          FREEQUEST_MAC_TARGET: ${{ matrix.target }}
      - run: lipo -archs apps/editor/dist-app/macos/*.app/Contents/MacOS/freequest-editor
      - uses: actions/upload-artifact@v4
        with:
          name: editor-${{ matrix.target }}
          path: apps/editor/dist-app/macos/*.dmg
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @freequest/editor tauri build --bundles nsis
      # Named like the Mac downloads (Tauri calls it "FreeQuest Editor_<version>_x64-setup.exe").
      - name: Name the installer
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p dist-windows
          mv apps/editor/src-tauri/target/release/bundle/nsis/*-setup.exe "dist-windows/FreeQuest-Editor-$version-Windows-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: editor-windows
          path: dist-windows/*.exe
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" downloads/*
          --draft --title "FreeQuest ${GITHUB_REF_NAME#v}"
          --notes "Downloads: the editor for Apple Silicon Macs, Intel Macs and Windows. See CHANGELOG.md for what's new."
