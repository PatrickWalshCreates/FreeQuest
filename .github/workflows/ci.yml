name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  # The macOS player app, a Mac export of the demo (checked the way players' Macs check it) and
  # the packaged editor app.
  mac-export:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Universal Mac apps: both architectures' Rust targets (the runner's Rust is rustup's).
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: pnpm build:mac-player
      - run: lipo -archs "apps/player-desktop/dist/macos/FreeQuest Player.app/Contents/MacOS/freequest-player" | grep -q x86_64
      - run: node packages/cli/dist/main.js export mac samples/demo-project --out "$RUNNER_TEMP/mac"
      - run: codesign --verify --deep --strict "$RUNNER_TEMP/mac/FreeQuest Demo.app"
      # The packaged editor (bundles the player app above); its stage script verifies the signature.
      - run: pnpm --filter @freequest/editor build:app
